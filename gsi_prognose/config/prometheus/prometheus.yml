global:
  scrape_interval: 15s      # Wie oft Prometheus Metriken sammelt
  evaluation_interval: 15s  # Wie oft Regeln evaluiert werden
  external_labels:
    monitor: 'gsi-monitor'

# Scrape-Konfigurationen
scrape_configs:
  # GSI Exporter
  - job_name: 'gsi-exporter'
    static_configs:
      - targets: ['gsi-exporter:8000']
        labels:
          instance: 'gsi-exporter'
          service: 'gsi-api'